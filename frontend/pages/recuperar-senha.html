<!DOCTYPE html>
<html lang="pt-BR" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFBF6">
<link rel="icon" type="image/png" href="/assets/brand/favicon.png?v=3">
<title>Voz em Estudo | Recuperar senha</title>
<script src="/js/utils/theme-init.js"></script>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/marque.css">
<link rel="stylesheet" href="/css/product.css">
<link rel="stylesheet" href="/css/library.css">
<link rel="stylesheet" href="/css/voz-redesign.css">

<script type="module" src="/js/pages/password-recovery.page.js"></script>
<script type="module" src="/js/utils/password-toggle.js"></script>
<link rel="stylesheet" href="/css/auth-pages.css?v=2" />
<script type="module" src="/js/i18n/boot.js"></script>
</head>
<body class="auth-page" data-page="recovery">
<div class="login-page">
<header class="login-header">
<a class="wordmark" href="./index.html" aria-label="Voz em Estudo — página inicial">
<img class="wordmark-logo" src="/assets/brand/logo-symbol.png?v=3" alt="" aria-hidden="true">
<span aria-hidden="true" class="brand-name"><span class="brand-main">Voz</span><span class="brand-em">em</span><span class="brand-main">Estudo</span></span>
</a><span class="prototype-label">Projeto acadêmico</span>
</header>
<main tabindex="-1" class="register-layout recovery-layout">
<section class="login-box" aria-labelledby="recovery-title">
<div class="login-box-heading"><p>Acesso</p><h1 id="recovery-title">Recuperar senha</h1>
<span data-recovery-description>Informe seu e-mail e enviaremos instruções, caso exista uma conta que permita recuperação por senha.</span></div>
<form class="login-form" data-recovery-request>
<label for="recovery-email"><span>E-mail</span><input id="recovery-email" type="email" name="email" autocomplete="email" required></label>
<button class="primary-action login-submit" type="submit">Enviar instruções</button>
</form>
<form class="login-form" data-recovery-update hidden>
<label for="new-password"><span>Nova senha</span><span class="password-field"><input id="new-password" name="senha" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="password-toggle" data-toggle-password="new-password" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button></span></label>
<label for="confirm-password"><span>Confirmar nova senha</span><span class="password-field"><input id="confirm-password" name="confirmacao" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="password-toggle" data-toggle-password="confirm-password" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button></span></label>
<button class="primary-action login-submit" type="submit">Salvar nova senha</button>
</form>

<p style="margin-top:20px"><a href="./login.html" class="secondary-action button-link login-register-link">Voltar ao login</a></p>
</section>
</main>
</div>
</body>
</html>
