[tool.ruff]
required-version = "==0.16.10"
target-version = "py310"
line-length = 100
extend-exclude = ["node_modules", ".venv", "frontend/tests/artifacts", "docs/implementation-2.0/evidence"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
